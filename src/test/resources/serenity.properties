# Additional Serenity properties file
# This complements serenity.conf and allows for simple key-value configurations

# Report customization
serenity.project.name=Selenium E2E BDD Framework
serenity.test.root=com.automation

# Screenshot settings - take screenshots for failures only
serenity.take.screenshots=FOR_FAILURES

# Report optimization
serenity.compress.filenames=true
serenity.keep.unscaled.screenshots=false

# Console output
serenity.console.colors=true
serenity.logging=VERBOSE

# Report encoding
report.encoding=UTF-8

