# Serenity BDD Configuration File
# This file contains all configuration settings for the test framework

# WebDriver Configuration
webdriver {
  # Default browser - can be overridden via command line: -Dwebdriver.driver=firefox
  driver = chrome
  
  # Base URL for the application under test
  base.url = "https://www.saucedemo.com"
  
  # Timeouts in milliseconds
  timeouts {
    implicitlywait = 10000
    fluentwait = 10000
  }
  
  # Chrome-specific options
  chrome {
    # Switches for Chrome browser
    switches = """--start-maximized;--disable-infobars;--disable-extensions;--disable-gpu;--disable-dev-shm-usage;--no-sandbox;--ignore-certificate-errors"""
  }
  
  # Firefox-specific options
  firefox {
    # Add Firefox preferences here if needed
  }
}

# Serenity Report Configuration
serenity {
  # Project name displayed in reports
  project.name = "Selenium E2E BDD Framework"
  
  # Test root package
  test.root = "com.automation"
  
  # Take screenshots for different scenarios
  take.screenshots = FOR_FAILURES
  
  # Compress large screenshots
  compress.filenames = true
  
  # Report encoding
  report.encoding = "UTF-8"
  
  # Console colors
  console.colors = true
  
  # Logging level
  logging = VERBOSE
  
  # Store HTML source for failed tests
  store.html.source = true
}

# Environment-specific configurations
environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  dev {
    webdriver.base.url = "https://dev.saucedemo.com"
  }
  staging {
    webdriver.base.url = "https://staging.saucedemo.com"
  }
  prod {
    webdriver.base.url = "https://www.saucedemo.com"
  }
}

